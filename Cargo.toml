[package]
name = "agentctl"
version = "0.3.0"
edition = "2026"
authors = ["rootphantomer"]
description = "CLI tool to detect and manage running Agent Gateway processes"
license = "MIT"
repository = "https://github.com/rootphantomer/agentctl"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"

[[bin]]
name = "agentctl"
path = "src/main.rs"
