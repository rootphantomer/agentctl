name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_suffix: x86_64-apple-darwin

          - target: aarch64-apple-darwin
            os: macos-15
            artifact_suffix: aarch64-apple-darwin

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_suffix: x86_64-unknown-linux-gnu

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_suffix: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf agentctl-${{ matrix.artifact_suffix }}.tar.gz agentctl
          echo "PACKAGE=agentctl-${{ matrix.artifact_suffix }}.tar.gz" >> $GITHUB_ENV

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentctl-${{ matrix.artifact_suffix }}
          path: target/${{ matrix.target }}/release/agentctl-${{ matrix.artifact_suffix }}.tar.gz

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/agentctl-${{ matrix.artifact_suffix }}.tar.gz
          generate_release_notes: true
