name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Sync version to package.json
        run: node scripts/sync-version.js

      - name: Check if version already published
        id: check_version
        run: |
          if npm view @rootphantomer/agentctl@${{ steps.version.outputs.VERSION }} --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version ${{ steps.version.outputs.VERSION }} already published, skipping"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Packages
        if: steps.check_version.outputs.already_published != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
